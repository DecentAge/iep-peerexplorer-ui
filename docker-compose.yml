version: '3.8'

services:
  iep-peerexplorer-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iep-peerexplorer-ui
    ports:
      - "4200:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
